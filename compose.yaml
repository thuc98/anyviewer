services:
  viewer:
    image: ultraview:local
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      TZ: Asia/Ho_Chi_Minh
      XDG_CONFIG_HOME: /data
      VIEWER_ALLOWED_HOSTS: "${VIEWER_ALLOWED_HOSTS:-localhost:${VIEWER_PORT:-8765},127.0.0.1:${VIEWER_PORT:-8765}}"
      VIEWER_WEBRTC_IP: "${VIEWER_WEBRTC_IP:-127.0.0.1}"
      VIEWER_WEBRTC_UDP_MIN: "50000"
      VIEWER_WEBRTC_UDP_MAX: "50020"
    ports:
      - "${VIEWER_BIND:-127.0.0.1}:${VIEWER_PORT:-8765}:8765/tcp"
      - "${VIEWER_BIND:-127.0.0.1}:50000-50020:50000-50020/udp"
    volumes:
      - viewer-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8765/"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  viewer-data:
